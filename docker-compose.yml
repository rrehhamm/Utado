services:
  postgres:
    image: postgres:16-alpine
    container_name: utado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: utado
      POSTGRES_PASSWORD: utado
      POSTGRES_DB: utado
    ports:
      - "5432:5432"
    volumes:
      - utado-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utado"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: utado-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  utado-postgres-data:
